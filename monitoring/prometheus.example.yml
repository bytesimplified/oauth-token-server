global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: oauth-token-server
    scheme: https
    metrics_path: /internal/metrics
    static_configs:
      - targets:
          - oauth.example.com
    # Prometheus 3.x custom-header secret file; avoid embedding keys in YAML.
    http_headers:
      X-Metrics-Key:
        files:
          - /run/secrets/oauth_metrics_key
