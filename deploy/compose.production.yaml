# Single-host TLS deployment example. Not a substitute for HA orchestration.
# Run: docker compose --env-file .env.production -f deploy/compose.production.yaml up -d --build
services:
  oauth:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env.production
    environment:
      OAUTH_ENV: production
    expose:
      - "8000"
    # Only Caddy is publicly reachable. Forwarded headers are trusted on this
    # private Docker network; do not publish the application's HTTP port.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OAUTH_DOMAIN: ${OAUTH_DOMAIN:?Set OAUTH_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - oauth
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
